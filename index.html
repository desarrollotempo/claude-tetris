<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
      <span id="theme-icon">🌙</span>
      <span class="switch"></span>
    </button>
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>

          <!-- Tabla de records (pantalla de inicio y game over) -->
          <div id="records-ui" class="records hidden">
            <p id="new-record-msg" class="new-record hidden">¡Nuevo récord!</p>
            <form id="name-form" class="name-form hidden">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" aria-label="Nombre del jugador" />
              <button type="submit" id="save-btn">Guardar</button>
            </form>
            <span class="label">MEJORES PUNTUACIONES</span>
            <table class="records-table">
              <thead>
                <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th></tr>
              </thead>
              <tbody id="records-body"></tbody>
            </table>
            <p id="records-empty" class="records-empty">Todavía no hay récords</p>
            <p class="records-stats">
              Mejor combo: <span id="best-combo">0</span> ·
              Líneas máx.: <span id="max-lines">0</span>
            </p>
            <button id="reset-records-btn" type="button" class="link-btn">Borrar records</button>
          </div>

          <button id="start-btn" class="hidden">Jugar</button>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
